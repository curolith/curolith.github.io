        <style>

            :root {
                /*region variables*/
                --color-background: #B36125;

                --filter-textless: blur(.5rem);

                --color-accent-primary: #302824;
                --color-accent-secondary: #DF792EFF;
                --color-effect: var(--color-accent-secondary);
                --color-front: #ffffff;
                --color-back: #000000;
                --color-transparency: rgb(0 0 0 / 0);

                --color-shadow-light: hsl(0 0% 100% / 0.63);
                --color-shadow-dark: hsl(0 0 0 / .25);

                --shadow-dark-small: -2px 2px 2px var(--color-shadow-dark);
                --shadow-dark-large: -10px 10px 20px var(--color-shadow-dark);
                --shadow-inset-light-small: inset -2px 2px 2px var(--color-shadow-light);
                --shadow-inset-dark-small: inset -2px 2px 2px var(--color-shadow-dark);

                --border-radius-small: .5rem;
                --border-radius-big: calc(2 * var(--border-radius-small));

                --gap-small: 1rem;
                --gap-medium: calc(2 * var(--gap-small));

                --padding-small: .5rem;
                --padding-medium: calc(2 * var(--padding-small));

                /*region color-derivation*/
                /*primary*/
                --color-neutral-p50: color-mix(var(--color-front), var(--color-back));

                --color-neutral-p25: color-mix(in srgb, var(--color-neutral-p50), var(--color-back));
                --color-neutral-p75: color-mix(in srgb, var(--color-front), var(--color-neutral-p50));

                --color-neutral-p12-5: color-mix(in srgb, var(--color-neutral-p25), var(--color-back));
                --color-neutral-p37-5: color-mix(in srgb, var(--color-neutral-p25), var(--color-neutral-p50));
                --color-neutral-p62-5: color-mix(in srgb, var(--color-neutral-p50), var(--color-neutral-p75));
                --color-neutral-p87-5: color-mix(in srgb, var(--color-neutral-p75), var(--color-front));

                /*primary*/
                --color-primary-p50: var(--color-accent-primary);

                --color-primary-p25: color-mix(in srgb, var(--color-primary-p50), var(--color-back));
                --color-primary-p75: color-mix(in srgb, var(--color-front), var(--color-primary-p50));

                --color-primary-p12-5: color-mix(in srgb, var(--color-primary-p25), var(--color-back));
                --color-primary-p37-5: color-mix(in srgb, var(--color-primary-p25), var(--color-primary-p50));
                --color-primary-p62-5: color-mix(in srgb, var(--color-primary-p50), var(--color-primary-p75));
                --color-primary-p87-5: color-mix(in srgb, var(--color-primary-p75), var(--color-front));

                /*secondary*/
                --color-secondary-p50: var(--color-accent-secondary);

                --color-secondary-p25: color-mix(in srgb, var(--color-secondary-p50), var(--color-back));
                --color-secondary-p75: color-mix(in srgb, var(--color-front), var(--color-secondary-p50));

                --color-secondary-p12-5: color-mix(in srgb, var(--color-secondary-p25), var(--color-back));
                --color-secondary-p37-5: color-mix(in srgb, var(--color-secondary-p25), var(--color-secondary-p50));
                --color-secondary-p62-5: color-mix(in srgb, var(--color-secondary-p50), var(--color-secondary-p75));
                --color-secondary-p87-5: color-mix(in srgb, var(--color-secondary-p75), var(--color-front));
                /*endregion color-derivation*/

                /*defaults*/
                --color-text-normal: var(--color-back);

            html {
                /*background-color: var(--color-neutral-p75);*/
                /*#d3d3d3;*/
                height: 100%;
                width: stretch;
            }

            .background-canvas {
                width: 100%;
                height: 100%;
                font: 50pt "Lucida Grande", Helvetica, Arial, sans-serif;
            }

            .root-container {
                gap: var(--gap-medium);
                display: flex;
                flex-direction: column;
            }

            .cell-top-bar, .root-top-bar {
                gap: var(--gap-small);
                display: flex;
                flex-direction: row;
            }

            .cell-bottom-bar {
                gap: var(--gap-small);
                display: flex;
                flex-direction: row;
                justify-content: center;
            }

            h1 {
                font-family: Consolas, "Courier New", monospace;
                margin: var(--padding-medium);
                color: var(--color-secondary-p50);
                font-size: xxx-large;
                font-weight: bolder;
                text-shadow: var(--shadow-dark-small);
            }

            .text-field {
                border-radius: var(--border-radius-small);
                inset: 1rem;
                background-color: color-mix(var(--color-transparency), var(--color-primary-p87-5));
                color: var(--color-text-normal);
                padding: var(--padding-small);
                transition: ease-in-out .25s;
                outline: transparent;
            }

            .text-field:focus, .text-field:active {
                transition: ease-in-out .25s;
                outline: var(--color-effect) solid 3px;
            }

            button {
                background-color: color-mix(var(--color-transparency), var(--color-secondary-p75));
                padding: var(--padding-small);
                border-radius: var(--border-radius-small);
                text-align: justify;
                font-family: system-ui, sans-serif;
                color: var(--color-text-normal);
                box-shadow: var(--shadow-inset-light-small),
                var(--shadow-dark-small);
                border: none;
                transition: ease-in-out 0.25s;
            }

            button:hover {
                transition: ease-in-out 0.25s;
                box-shadow: var(--shadow-inset-light-small),
                var(--shadow-dark-small);
                border-radius: 0;
            }

            button:active {
                transition: ease-in-out 0.25s;
                background-color: var(--color-primary-p25);
            }

            .code-field {
                font-family: Consolas, "Courier New", monospace;
                border-radius: var(--border-radius-small);
                inset: 1rem;
                background-color: var(--color-neutral-p75);
                color: var(--color-text-normal);
                box-shadow: var(--shadow-inset-dark-small);
                padding: var(--padding-small);
                transition: ease-in-out .25s;
                outline: transparent;
            }

            .code-field:focus, .code-field:active {
                transition: ease-in-out .25s;
                outline: var(--color-effect) solid 3px;
            }

            .code-output-box {
                font-family: Consolas, "Courier New", monospace;
                background-color: color-mix(var(--color-transparency), color-mix(var(--color-transparency), var(--color-primary-p37-5)));
                color: var(--color-secondary-p75);
                border-radius: 0.5rem;
                inset: 1rem;
                /*box-shadow: var(--shadow-inset-dark-small);*/
                transition: ease-in-out .25s;
                outline: transparent;
            }

            .code-output-field {
                font-family: Consolas, "Courier New", monospace;
                color: var(--color-secondary-p75);
                border-radius: 0.5rem;
                inset: 1rem;
                padding: var(--padding-small);
                transition: ease-in-out .25s;
                outline: transparent;
            }

            body {
                padding: 2rem;
                display: flex;
                flex-direction: column;
            }

            .cell-container {
                display: flex;
                flex-direction: column;
                gap: var(--gap-medium);
            }

            .cell {
                transition: ease-in-out 1.25s;
                padding: 1rem;
                background-color: color-mix(var(--color-transparency), color-mix(var(--color-transparency), var(--color-primary-p75)));
                border-radius: 1rem;
                gap: 1rem;
                display: grid;
                font-family: system-ui, sans-serif;
                backdrop-filter: var(--filter-textless);
                box-shadow: var(--shadow-inset-light-small),
                var(--shadow-dark-large);
            }
        </style>
    </head>

    <script>
        class JSaturnBuildUtility {
            static applicable(o) {
                o['apply'] = (f) => {
                    f(o);
                    return o;
                }
                return o;
            }

            static addUUID(element) {
                element.id = crypto.randomUUID();
            }

            static createElement(tag, className) {
                return JSaturnBuildUtility.applicable(document.createElement(tag))
                    .apply(element => {
                        JSaturnBuildUtility.addUUID(element);
                        element.className = className;
                    });
            }

            static createDiv(className) {
                return JSaturnBuildUtility.createElement('div', className);
            }

            static createButton(className, clickAction, innerHTML, param) {
                return JSaturnBuildUtility.createElement('button', className).apply(button => {
                    button.param = param;
                    button.onclick = () => clickAction(button);
                    button.innerHTML = innerHTML;
                });
            }
        }

        class JSaturnBuilders {
            static createCodeField(code) {
                return JSaturnBuildUtility.createDiv('code-field').apply(codeField => {
                        codeField.contentEditable = 'true';
                        codeField.innerHTML = code ?? "";
                    }
                )
            }

            static createTextField() {
                return JSaturnBuildUtility.createDiv("text-field").apply(textField => {
                    textField.contentEditable = 'true';
                });
            }

            static createCell() {
                return JSaturnBuildUtility.createDiv("cell").apply(cell => cell.append(
                    JSaturnBuildUtility.createDiv("cell-top-bar").apply(cellControls => cellControls.append(
                        JSaturnBuildUtility.createButton('delete-cell-button', (button) => {
                            button.param.remove();
                            JSaturnRoot.ensureAny()
                        }, `❌`, cell),
                    )),
                    JSaturnBuildUtility.createDiv("cell-content"),
                    JSaturnBuildUtility.createDiv("cell-bottom-bar").apply(divider => divider.append(
                        JSaturnBuildUtility.createButton('add-cell-below-button', (button) => button.param.after(JSaturnBuilders.createCodeCell()), '➕ <>', cell),
                        JSaturnBuildUtility.createButton('add-text-below-button', (button) => button.param.after(JSaturnBuilders.createTextCell()), '➕ T', cell)
                    ))
                ));
            }

            static createCodeCell(code) {
                return JSaturnBuilders.createCell().apply(cell => {
                    cell['persistenceKey'] = 'code-cell';
                    cell.querySelector('.cell-content').append(
                        JSaturnBuildUtility.createDiv("code-output-box").apply(codeOutputBox => {
                            codeOutputBox.append(
                                JSaturnBuilders.createCodeField(code).apply(codeField => {
                                    codeField.addEventListener('keypress', function (e) {
                                        if (e.key === '\n') {
                                            JSaturnCodeCellUtility.runCell(cell)
                                        }
                                    });
                                }),
                            )
                            codeOutputBox.setOutput = (output) => {
                                codeOutputBox.querySelectorAll('.code-output-field').forEach(field => field.remove());
                                if (output.length > 0) {
                                    codeOutputBox.append(JSaturnBuildUtility.createDiv("code-output-field")
                                        .apply(outputField => outputField.innerHTML = output));
                                }
                            }
                        })
                    )
                    cell.querySelector('.cell-top-bar').append(
                        JSaturnBuildUtility.createButton('run-button', (button) => JSaturnCodeCellUtility.runCell(button.param), '▶️', cell)
                    )
                })
            }

            static createTextCell(text) {
                return JSaturnBuilders.createCell().apply(cell => {
                    cell['persistenceKey'] = 'text-cell';
                    cell.querySelector('.cell-content')
                        .append(JSaturnBuilders.createTextField().apply(textField => textField.innerHTML = text ?? ""));
                });
            }
        }

        class JSaturnCodeCellUtility {
            static runCell(cell) {
                const code = cell.querySelector('.code-field');
                if (!code) {
                    return;
                }
                const codeText = code.innerText;
                const resultStrings = [];
                const logOutput = (args) => resultStrings.push("> " + String(args));
                const consoleBox = console;
                const global = document['global'] ?? {}
                console = {
                    log: logOutput
                };
                try {
                    const output = eval(codeText);
                    if (output && output !== 1) {
                        logOutput(output);
                    }
                } catch (e) {
                    logOutput(e);
                }
                document['global'] = global;
                console = consoleBox;
                cell.querySelector('.code-output-box').setOutput(resultStrings.join("<br>"));
                JSaturnCodeCellUtility.highlightCell(cell);
            }

            static highlightCell(cell) {
                const codeField = cell.querySelector('.code-field');
                if (!codeField) {
                    JSaturnRoot.log(
                        'error',
                        "No code-field found on cell to highlight",
                        "62a5a9b2-eaf1-4d79-a441-0e006f6def10",
                        cell
                    )
                }
                const codeText = codeField.innerText//.replace(/\n/g, '/*br*/');
                const highlighted = hljs.highlight(codeText, {
                    language: 'javascript',
                    ignoreIllegals: true
                });
                codeField.innerHTML = highlighted.value.replace(/\n/g, '<br>');
                window.getSelection().removeAllRanges();
                // TODO https://dev.to/saurabh_raj_afaabe1844a4c/mastering-selection-and-ranges-in-javascript-never-to-look-back-again-2mkk
                // myRange = document.createRange();
                // window.getSelection().addRange(myRange)
                // window.setSelection(selectionData);
            }

            static runAll() {
                document.querySelectorAll(".cell").forEach(cell => {
                    JSaturnCodeCellUtility.runCell(cell);
                });
            }
        }

        class JSaturnRoot {
            static runtimeData = {
                log: [],
            };

            static init() {
                const lastSave = JSaturnStorage.load('lastSave');
                if (lastSave) {
                    JSaturnStorage.restoreState();
                }
            }

            static ensureAny() {
                const container = document.querySelector('#cell-container');
                if (container.childElementCount === 0) {
                    container.append((document.configData?.demoCodeFilledOnce ?
                        JSaturnBuilders.createCodeCell() :
                        (() => {
                            document.configData = {demoCodeFilledOnce: true};
                            return JSaturnBuilders.createCodeCell(
                                "const greeting = \"Hello\";\n" +
                                "global.planet = \"Saturn\"; // global is available to all cells\n" +
                                "console.log(`${greeting} ${global.planet}!`);"
                            )
                        })()).apply(JSaturnCodeCellUtility.highlightCell));
                }
            }

            static log(type, message, causeId, context) {
                const logObject = JSON.stringify({
                    type: type,
                    message: message,
                    causeId: causeId,
                    context: context,
                });
                console.log(logObject);
                JSaturnRoot.runtimeData.log.push(logObject);
            }

            static mountDebugger() {
                console.log("mountDebugger");
            }
        }

        class JSaturnDataModel {
            static 'code-cell' = {
                deserialize: (persistenceData) => {
                    return JSaturnBuilders.createCodeCell(persistenceData.data).apply(JSaturnCodeCellUtility.highlightCell);
                },
                serialize: (jSaturnElement) => {
                    return {
                        persistenceKey: 'code-cell',
                        data: jSaturnElement.querySelector('.code-field').innerText
                    }
                }
            }

            static 'text-cell' = {
                deserialize: (persistenceData) => {
                    return JSaturnBuilders.createTextCell(persistenceData.data);
                },
                serialize: (jSaturnElement) => {
                    return {
                        persistenceKey: 'text-cell',
                        data: jSaturnElement.querySelector('.text-field').innerHTML
                    }
                }
            }

            static 'root-container' = {
                deserialize: (persistenceData) => {
                    const rootContainer = JSaturnBuildUtility.applicable(document.querySelector('#root-container'));
                    const children = [...persistenceData.data?.children]?.map(JSaturnDataModel.deserialize);
                    rootContainer.append(...children);
                    return rootContainer;
                },
                serialize: (jSaturnElement) => {
                    return {
                        persistenceKey: 'root-container',
                        data: {
                            children: JSaturnDataModel.serializeChildren(jSaturnElement)
                        }
                    }
                }
            }

            static 'cell-container' = {
                deserialize: (persistenceData) => {
                    const cellContainer = JSaturnBuildUtility.applicable(document.querySelector('#cell-container'));
                    cellContainer.innerHTML = '';
                    const children = [...persistenceData.data?.children]?.map(JSaturnDataModel.deserialize);
                    cellContainer.append(...children);
                    return cellContainer;
                },
                serialize: (jSaturnElement) => {
                    return {
                        persistenceKey: 'cell-container',
                        data: {
                            children: JSaturnDataModel.serializeChildren(jSaturnElement)
                        }
                    }
                }
            }

            static getModel(object) {
                return JSaturnDataModel[object['persistenceKey'] ?? object['className'] ?? 'default'] ?? null;
            }

            static deserialize(persistenceData) {
                const element = JSaturnDataModel.getModel(persistenceData)?.deserialize(persistenceData);
                if (element) {
                    return element;
                }
                JSaturnRoot.log(
                    'error',
                    'No deserialization implementation found',
                    '8ae76dbf-fd43-4ffd-84f1-a4a40619d440',
                    persistenceData
                )
            }

            static serialize(persistenceElement) {
                return JSaturnDataModel.getModel(persistenceElement)?.serialize(persistenceElement);
            }

            static serializeChildren(persistenceElement) {
                return [...persistenceElement.children].map(JSaturnDataModel.serialize).filter(Boolean);
            }

            static serializeFromRoot() {
                // TODO rename to: root-container
                const root = document.querySelector('#root-container')
                return JSaturnDataModel.serialize(root);
            }
        }

        class JSaturnStorage {
            static restoreState() {
                const serializedData = JSaturnStorage.load('jSaturnRootData');
                JSaturnDataModel.deserialize(serializedData);
            }


            static store(storable) {
                if (!storable.key) {
                    JSaturnRoot.log(
                        'error',
                        'No key provided for storable',
                        '06afa351-f87c-4c3f-ad4a-7e90afac5281',
                        storable
                    )
                }
                localStorage.setItem(storable.key, JSON.stringify(storable.data));
            }

            static load(key) {
                return JSON.parse(localStorage.getItem(key));
            }

            static saveState() {
                const serializedData = JSaturnDataModel.serializeFromRoot();
                JSaturnStorage.store({
                    key: 'jSaturnRootData',
                    data: serializedData
                });
                JSaturnStorage.store({
                    key: 'lastSave',
                    data: Date.now()
                })
            }
        }
    </script>

    <body>
        <div id="root-container" class="root-container">
            <h1>> JSaturn</h1>
            <div id="header" class="cell">
                <div id="root-container-top-bar" class="root-top-bar">
                    <button id="run-all" onclick="JSaturnCodeCellUtility.runAll()">⏩</button>
                    <button id="save" onclick="JSaturnStorage.saveState()">💾</button>
                </div>
            </div>
            <div id="cell-container" class="cell-container"></div>
        </div>
        <script>
            JSaturnRoot.init();
        </script>
    </body>
</html>
